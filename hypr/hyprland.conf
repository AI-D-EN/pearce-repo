
monitor=,preferred,auto,1

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum

#plugins
#plugin = hyprgrass

#exec-once = sleep 2 && /usr/bin/waybar
exec-once = nohup waybar >/dev/null 2>&1 &
exec-once = nm-applet
exec-once = blueman-applet
exec-once = hyprpaper
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = swaync
exec-once = bash -c "rm -f /tmp/wobpipe && mkfifo /tmp/wobpipe && tail -f /tmp/wobpipe | wob"
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
#exec-once = /usr/libexec/evolution-calendar-factory
#exec-once = /usr/libexec/evolution-source-registry
exec-once = /usr/libexec/evolution-source-registry
exec-once = /usr/libexec/evolution-calendar-factory
exec-once = gnome-calendar --gapplication-service


#windowfloat rules
windowrulev2 = float, class:^(kitty-float)$
windowrulev2 = size 1200 550, class:^(kitty-float)$
windowrulev2 = center, class:^(kitty-float)$
#wifi
windowrulev2 = float,class:^(org.kde.plasmawindowed)$,title:^(Networks)$
windowrulev2 = size 420 500,class:^(org.kde.plasmawindowed)$,title:^(Networks)$
windowrulev2 = move 1485 60,class:^(org.kde.plasmawindowed)$,title:^(Networks)$
#bluetooth
windowrulev2 = float,class:^(org.kde.plasmawindowed)$,title:^(Bluetooth)$
windowrulev2 = size 420 500,class:^(org.kde.plasmawindowed)$,title:^(Bluetooth)$
windowrulev2 = move 1485 60,class:^(org.kde.plasmawindowed)$,title:^(Bluetooth)$
#battery
windowrulev2 = float,class:^(org.kde.plasmawindowed)$,title:^(Power and Battery)$
windowrulev2 = size 420 500,class:^(org.kde.plasmawindowed)$,title:^(Power and Battery)$
windowrulev2 = move 1485 60,class:^(org.kde.plasmawindowed)$,title:^(Power and Battery)$
#speakers audio
windowrulev2 = float,class:^(org.kde.plasmawindowed)$,title:^(Audio Volume)$
windowrulev2 = size 420 500,class:^(org.kde.plasmawindowed)$,title:^(Audio Volume)$
windowrulev2 = move 1485 60,class:^(org.kde.plasmawindowed)$,title:^(Audio Volume)$
#calendar
windowrulev2 = float,class:^(org.gnome.Calendar)$
windowrulev2 = move 510 60,class:^(org.gnome.Calendar)$
windowrulev2 = size 900 650,class:^(org.gnome.Calendar)$

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.3
    }
    #sensitivity = -0.6
}

plugin {
    hyprgrass {
        swipe_fingers = 3
        workspace_swipe = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(88c0d0)
    col.inactive_border = rgb(3b4252)
    layout = dwindle
}

decoration {
    rounding = 13

    blur {
        enabled = yes
        size = 8
        passes = 3
        new_optimizations = on
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(000000aa)
    }

}

animations {
    enabled = yes

    bezier = nord,0.05,0.9,0.1,1.05

    animation = windows,1,6,nord
    animation = border,1,10,default
    animation = fade,1,6,default
    animation = workspaces,1,6,nord

    #bezier = smooth, 0.25, 0.1, 0.25, 1.0
    #animation = layers, 1, 5, smooth, slide
}

misc {
    force_default_wallpaper = 0
}

$mainMod = SUPER

#Apps
# tiled kitty
bind = SUPER, RETURN, exec, kitty
# floating kitty
bind = SUPER, T, exec, kitty --class kitty-float

bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, dolphin
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, L, exec, wlogout

#focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

#movefocus
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

#full
bind = SUPER, F, fullscreen

#workspace

# Switch workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6

#fn key binds
# Volume controls
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +3
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -3
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Brightness controls
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

#caps lock
#bind = , Caps_Lock, exec, swayosd-client --caps-lock
#bind = , Caps_Lock, exec, bash -c 'sleep 0.05 && swayosd-client --caps-lock'

# Move window
bindm = SUPER, mouse:272, movewindow

# Resize window
bindm = SUPER, mouse:273, resizewindow

# Workspace scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

#clipboard
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p clipboard -theme ~/.config/rofi/nord.rasi | cliphist decode | wl-copy
bind = SUPER SHIFT, V, exec, cliphist wipe && wl-copy ""

layerrule = blur,waybar
layerrule = ignorealpha 0.5,waybar
layerrule = blur, swayosd
layerrule = ignorealpha 0.1, swayosd
layerrule = animation slide bottom, swayosd

layerrule = animation slide top, rofi
layerrule = blur, rofi
layerrule = ignorealpha 0.5, rofi
layerrule = noanim, rofi:first
