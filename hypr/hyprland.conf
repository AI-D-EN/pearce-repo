
monitor=,preferred,auto,1

exec-once = awww-daemon

exec-once = hypridle

exec-once = sleep 1 && waybar
exec-once = sleep 7 && nm-applet
exec-once = sleep 4 && blueman-applet

exec-once = swaync
exec-once = /usr/bin/swayosd-server

exec-once = bash -c 'while true; do ~/.config/hypr/scripts/cover.sh; sleep 2; done'
exec-once = kitty --listen-on unix:/tmp/kitty-aiden

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24


env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,kvantum



#Windowfloat rules

windowrule {
  name = windowrule-1
  float = on
  center = on
  size = 900 550
  match:class = ^(kitty-float)$
}
windowrule {
    name = windowrule-3
    float = on
    center = on
    size = 850 650
    match:title = ^(Waypaper)$
}
windowrule {
    name = windowrule-5
    float = on
    size = 365 365 
    move = 1452 68
    match:class = ^(blueman-manager)$
}
windowrule {
    name = windowrule-6
    float = on
    center = on
    size = 900 600
    match:title = ^(LocalSend)$
}
windowrule {
  name = windowrule-9
  opacity = 0.95 0.92
  match:class = ^(thunar)$
}




input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.3
    }
    #sensitivity = -0.6
}


#Colors_source

source = ~/.config/hypr/colors.conf


general {

    gaps_in = 5
    gaps_out = 18

    border_size = 2

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    layout = dwindle
}


decoration {
    rounding = 13

    active_opacity = 0.97
    inactive_opacity = 0.92

    blur {
        enabled = yes
        size = 8
        passes = 3
        new_optimizations = on
        new_optimizations = true
    }

   shadow {
    enabled = yes
    range = 18
    render_power = 4
    color = rgba(00000040)
    }
}

#Animations

source = ~/.config/hypr/animations/smooth.conf
   

misc {
    force_default_wallpaper = 0
    

    animate_manual_resizes = yes
    animate_mouse_windowdragging = yes

}


#Apps

# floating kitty
bind = SUPER, T, exec, kitty --class kitty-float


# tiled kitty
bind = SUPER, RETURN, exec, kitty


bind = SUPER, Q, killactive
bind = SUPER, E, exec, thunar
bind = SUPER, R, exec, rofi -show drun
bind = SUPER, escape, exec, wlogout --protocol layer-shell
bind = SUPER, P, exec, grimblast copy area
bind = SUPER SHIFT, P,exec, grimblast save area ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png

#focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

#movefocus
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

#full
bind = SUPER, F, fullscreen

#workspace

# Switch workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6

#fn key binds

# Volume
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +2
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -2
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower



# Move window
bindm = SUPER, mouse:272, movewindow

# Resize window
bindm = SUPER, mouse:273, resizewindow

# Workspace scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1


# Hyprlock
bind = SUPER, L, exec, hyprlock

#wallpaper
bind = SUPER, W, exec, ~/.config/hypr/scripts/wallpaper-menu.sh
bind = SUPER, R, submap, resize

#browser
bind = SUPER, B, exec ,firefox

#Yazi
bind = SUPER SHIFT, E, exec, kitty -e yazi





