animations {
    
    enabled = yes

    # Fast + crisp bezier curves
    bezier = snap, 0.2, 0.9, 0.3, 1.0
    bezier = snapOut, 0.4, 0.0, 1.0, 1.0
    bezier = smoothFade, 0.3, 0.0, 0.1, 1.0

    # Windows open/close
    animation = windows, 1, 4, snap
    animation = windowsOut, 1, 3, snapOut

    # Borders
    animation = border, 1, 8, snap

    # Fade animation
    animation = fade, 1, 4, smoothFade

    # Workspace switch (no slide)
    animation = workspaces, 1, 5, snap, slidefade
}