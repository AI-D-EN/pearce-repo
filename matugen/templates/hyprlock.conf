general {
disable_loading_bar = true
hide_cursor = false

```
grace = 2

no_fade_in = false
no_fade_out = false
```

}

background {
monitor =
path = screenshot

```
blur_passes = 2
blur_size = 7

noise = 0.0117
contrast = 1.1
brightness = 0.75

vibrancy = 0.20
vibrancy_darkness = 0.0
```

}

# CLOCK

label {
monitor =
text = cmd[update:1000] echo "$(date +"%-H:%M")"

```
color = rgb({{colors.primary.default.hex_stripped}})

font_size = 72
font_family = JetBrainsMono Nerd Font Mono ExtraBold

position = 0, 120

halign = center
valign = center
```

}

# DATE

label {
monitor =
text = cmd[update:1000] echo "$(date +"%A, %d %b")"

```
color = rgb({{colors.on_surface.default.hex_stripped}})

font_size = 22
font_family = JetBrainsMono Nerd Font Mono

position = 0, 55

halign = center
valign = center
```

}

# PASSWORD BOX

input-field {
monitor =

```
size = 260, 55

outline_thickness = 2

dots_size = 0.20
dots_spacing = 0.35
dots_center = true

outer_color = rgb({{colors.primary.default.hex_stripped}})
inner_color = rgba(255,255,255,0.10)
font_color = rgb({{colors.on_surface.default.hex_stripped}})

fade_on_empty = false
placeholder_text = <i>Password...</i>

hide_input = false
rounding = 16

check_color = rgb({{colors.tertiary.default.hex_stripped}})
fail_color = rgb({{colors.error.default.hex_stripped}})

position = 0, -35

halign = center
valign = center
```

}

# MUSIC CARD

shape {
monitor =
size = 520, 110

```
color = rgba({{colors.surface.default.rgb}},0.45)

rounding = 24

border_size = 1
border_color = rgba(255,255,255,0.08)

position = 0, -300

halign = center
valign = center

shadow_passes = 2
shadow_size = 6
```

}

# ALBUM ART

image {
monitor =
path = ~/.cache/cover.jpg

```
size = 72

rounding = 18

position = -190, -300

halign = center
valign = center

